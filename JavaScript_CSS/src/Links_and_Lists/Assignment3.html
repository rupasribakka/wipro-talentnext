<!DOCTYPE html>
<html>
<head>
    <title>Links - Assignment 3</title>

    <style>
        a:link {
            background-color: #FF0000;
        }

        a:visited {
            background-color: #FFFF00;
        }

        a:hover {
            background-color: #FF00FF;
        }

        a:active {
            background-color: #0000FF;
        }
    </style>
</head>

<body>

    <h2>Link Background Colors</h2>

    <a href="https://www.google.com">
        Visit Google
    </a>

</body>
</html>
