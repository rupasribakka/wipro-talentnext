<!DOCTYPE html>
<html>
<head>
    <title>Links - Assignment 1</title>

    <style>
        a:link {
            color: #FF0000;
        }

        a:visited {
            color: #FFFF00;
        }

        a:hover {
            color: #FF00FF;
        }

        a:active {
            color: #0000FF;
        }
    </style>
</head>

<body>

    <h2>Link Colors</h2>

    <a href="https://www.google.com">
        Visit Google
    </a>

</body>
</html>
