<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <center>

        <h2>
            <font color="blue">Account Login</font>
        </h2>

        <table border="1" bgcolor="lightseagreen">

            <tr>
                <td><b>User Name:</b></td>
                <td>
                    <input type="text" maxlength="8">
                </td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td>
                    <input type="password" maxlength="8">
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </center>

</body>
</html>
